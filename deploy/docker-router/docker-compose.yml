# CS2Suite — MySQL 数据库(路由器 Docker 部署)
#
# 适用:能跑 Docker 的路由器 / NAS / 小主机(x86_64 或 arm64)。
# 用法:
#   1. cp .env.example .env   然后编辑 .env(务必改密码!)
#   2. docker compose up -d
#   3. docker compose logs -f mysql     看到 "ready for connections" 即成功
#
# 说明:首次启动时会自动执行 initdb/ 下的 SQL(建库 + 建表 + 建远程用户),
#       之后即使重启也不会重复执行;数据保存在命名卷 cs2suite-mysql-data 中。

services:
  mysql:
    image: mysql:8.0
    container_name: cs2suite-mysql
    restart: unless-stopped
    # 路由器内存有限,给容器加硬上限,避免把路由器打爆
    mem_limit: ${MYSQL_MEM_LIMIT:-512m}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # ★ 时区:插件/网页里大量使用 NOW(),必须与宿主机一致,否则心跳/排行榜时间会错位
      - --default-time-zone=${MYSQL_TZ:-+08:00}
      # 路由器/小主机省内存配置
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-64M}
      - --performance-schema=OFF
      - --max-connections=${MYSQL_MAX_CONN:-50}
      - --table-open-cache=200
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      # 局域网内使用;如需公网访问请务必配合防火墙白名单(见 README)
      - --bind-address=0.0.0.0
      # 允许从游戏服务器远程连接
      - --mysqlx=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cs2suite}
      MYSQL_USER: ${MYSQL_USER:-cs2suite}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先在 .env 中设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 左侧是路由器上对外暴露的端口;若 3306 已被占用可改左侧
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - cs2suite-mysql-data:/var/lib/mysql
      # 首次启动自动导入(建库/建表);已存在的库不会被覆盖
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  cs2suite-mysql-data:
    name: cs2suite-mysql-data
